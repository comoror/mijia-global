<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>米家出海服务器覆盖地图</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --line: #dfe7f0;
      --text: #18324a;
      --muted: #70839a;
      --accent: #18b8a5;
      --accent-2: #e29a16;
      --country: #dce7f1;
      --country-hover: #bfd4e5;
      --shadow: 0 14px 36px rgba(45, 77, 108, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
    }
    .shell { max-width: 1120px; margin: 0 auto; padding: 22px 22px 30px; }
    .topbar { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 36px); line-height: 1.1; letter-spacing: -.04em; }
    .status { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(81,214,196,.12); }
    .map-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
    .map-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .map-title { font-size: 15px; font-weight: 700; }
    .map-hint { color: var(--muted); font-size: 12px; }
    .map-wrap { position: relative; min-height: 300px; padding: 14px 20px; background: #f8fbfd; }
    #map { display: block; width: 100%; height: auto; min-height: 270px; }
    .country { fill: var(--country); stroke: #ffffff; stroke-width: .55; vector-effect: non-scaling-stroke; transition: fill .22s ease, stroke .22s ease, opacity .22s ease; }
    .country:hover { fill: var(--country-hover); stroke: #6b8aa3; cursor: pointer; }
    .country.active { fill: var(--accent); stroke: #ffffff; }
    .country.active:hover { fill: #9af3e7; }
    .country.focus { fill: #ff9f43; stroke: #c96800; stroke-width: 1.25; opacity: 1; }
    .country.dim { opacity: .38; }
    .country-link { display: inline-block; margin: 0 4px 4px 0; padding: 3px 7px; border: 1px solid #dfe7f0; border-radius: 6px; color: #35708f; background: #f7fbfd; cursor: pointer; font-size: 12px; text-decoration: none; }
    .country-link:hover, .country-link.selected { color: #9a5200; border-color: #ffb45e; background: #fff2df; }
    .map-legend { position: absolute; right: 24px; bottom: 18px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.9); color: var(--muted); font-size: 11px; }
    .legend-color { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
    .controls { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
    .panel { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .panel-label { margin: 0 0 14px; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .server-list { display: flex; flex-wrap: nowrap; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
    button { font: inherit; }
    .server-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); cursor: pointer; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .server-btn:hover { transform: translateY(-2px); border-color: rgba(81,214,196,.75); }
    .server-btn.selected { border-color: var(--accent); background: rgba(81,214,196,.13); box-shadow: 0 0 0 3px rgba(81,214,196,.08); }
    .server-icon { width: 9px; height: 9px; border-radius: 50%; background: var(--server-color, var(--accent)); }
    .server-meta { margin-left: 2px; color: var(--muted); font-size: 12px; }
    .summary { display: grid; grid-template-columns: 180px 180px; gap: 12px; }
    .metric { padding: 11px; border-radius: 10px; background: #f1f6fa; }
    .metric-value { display: block; color: var(--accent-2); font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
    .metric-name { color: var(--muted); font-size: 12px; }
    .countries { max-height: none; overflow: visible; margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .tooltip { position: fixed; z-index: 3; display: none; max-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #ffffff; box-shadow: var(--shadow); font-size: 12px; pointer-events: none; }
    .empty { color: var(--muted); font-size: 13px; }
    @media (max-width: 800px) {
      .shell { padding: 24px 15px 30px; }
      .topbar { display: block; }
      .status { width: fit-content; margin-top: 18px; }
      .map-wrap { min-height: 280px; padding: 10px; }
      #map { min-height: 250px; }
    }
  </style>
</head>

    const renderWorld = async () => { const response = await fetch("world.geojson"); const data = await response.json(); const allCodes = data.features.map(canonicalCode).filter(Boolean); serverCodes["新加坡"] = new Set(allCodes.filter(code => !europeCodes.has(code) && !americasCodes.has(code) && !["RUS", "IND", "CHN"].includes(code))); data.features.forEach(feature => { const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); const code = canonicalCode(feature); path.setAttribute("d", geometryPath(feature.geometry)); path.dataset.code = code; path.dataset.name = chineseNames[code] || feature.properties.name; path.classList.add("country"); path.addEventListener("mouseenter", e => { tooltip.textContent = path.dataset.name; tooltip.style.display = "block"; tooltip.style.left = `${e.clientX + 12}px`; tooltip.style.top = `${e.clientY + 12}px`; }); path.addEventListener("mousemove", e => { tooltip.style.left = `${e.clientX + 12}px`; tooltip.style.top = `${e.clientY + 12}px`; }); path.addEventListener("mouseleave", () => tooltip.style.display = "none"); map.appendChild(path); }); selectServer("俄罗斯"); };

    const tooltip = document.getElementById("tooltip");
    const displayCounts = { "俄罗斯": 1, "欧洲": 54, "美国": 53, "印度": 1, "新加坡": 150 };
    Object.entries(servers).forEach(([name, info]) => { const button = document.createElement("button"); button.className = "server-btn"; button.style.setProperty("--server-color", info.color); button.innerHTML = `<span class="server-icon"></span><span>${name}</span><span class="server-meta">${displayCounts[name]} 个区域</span>`; button.addEventListener("click", () => selectServer(name)); list.appendChild(button); });
    function selectServer(name) { const supported = serverCodes[name] || new Set(); document.querySelectorAll(".server-btn").forEach(b => b.classList.toggle("selected", b.textContent.trim().startsWith(name))); document.querySelectorAll(".country").forEach(p => { const on = supported.has(p.dataset.code); p.classList.toggle("active", on); p.classList.toggle("dim", !on); p.classList.remove("focus"); }); document.getElementById("countryCount").textContent = displayCounts[name]; document.getElementById("serverName").textContent = name; const detail = document.getElementById("countryNames"); detail.replaceChildren(); servers[name].countries.forEach(country => { const link = document.createElement("a"); link.href = "#"; link.className = "country-link"; link.textContent = country; link.addEventListener("click", event => { event.preventDefault(); const focused = [...document.querySelectorAll(".country")].filter(path => path.dataset.name === country || chineseNames[path.dataset.code] === country); document.querySelectorAll(".country-link").forEach(item => item.classList.remove("selected")); document.querySelectorAll(".country").forEach(path => path.classList.remove("focus")); if (focused.length) { link.classList.add("selected"); focused.forEach(path => path.classList.add("focus")); focused[0].scrollIntoView({ behavior: "smooth", block: "center" }); } }); detail.appendChild(link); }); }
    renderWorld();
  </script>
